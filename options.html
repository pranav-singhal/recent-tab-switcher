<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Recent Tab Switcher</title>
  <style>
    :root { color-scheme: light dark; --accent: #8b7bff; --muted: #888; --card: rgba(127,127,127,.1); }
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    header img { width: 56px; height: 56px; }
    h1 { font-size: 22px; margin: 0; }
    .card { background: var(--card); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    h2 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--muted); }
    .recorder { display: inline-block; min-width: 180px; padding: 10px 14px; border-radius: 8px; border: 2px solid transparent;
      background: rgba(127,127,127,.15); font-weight: 600; cursor: pointer; text-align: center; outline: none; }
    .recorder.recording { border-color: var(--accent); color: var(--accent); }
    .msg { margin-top: 10px; font-size: 13px; min-height: 1.5em; }
    .msg.error { color: #e5484d; }
    .msg.ok { color: #30a46c; }
    button { padding: 8px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button.link { background: none; color: var(--accent); padding: 0; margin-left: 12px; }
    kbd { font: 600 12px ui-monospace, monospace; padding: 1px 6px; border-radius: 4px; background: rgba(127,127,127,.2); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon128.png" alt="">
    <h1>Recent Tab Switcher</h1>
  </header>

  <div class="card">
    <h2>Switcher shortcut</h2>
    <p>Hold the modifier and tap the key to show your recent tabs. Release the modifier to switch.</p>
    <div id="recorder" class="recorder" tabindex="0"></div>
    <button id="reset" class="link">Reset to default</button>
    <div id="msg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Quick jump shortcut</h2>
    <p>Jumps straight to your last tab with no list. Works on every page, including new tab and settings. Chrome manages this one.</p>
    <button id="chromeShortcuts">Change in Chrome settings</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
